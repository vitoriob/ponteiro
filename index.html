<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponteiro – Confinamento</title>
<meta name="description" content="Manejo de confinamento de gado: trato, capacidade, preços, valor do rebanho e alertas sanitários. Funciona sem internet.">
<meta name="theme-color" content="#1d4a36">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral verde-pasto no computador; no celular, cabeçalho verde + barra de abas embaixo, ao alcance do polegar.
   Identidade: verde de pasto, amarelo de brinco (etiqueta de orelha) como acento, números em fonte condensada de placa de fazenda. */
:root{
  --bg:#edf0ea; --surface:#ffffff; --surface-2:#f4f6f1; --ink:#16231b; --muted:#5a6b60; --line:#d6ddd3;
  --pasto:#1d4a36; --pasto-2:#2a6449; --pasto-ink:#f3f6ef; --pasto-soft:#dfeadf;
  --brinco:#f2c12e; --brinco-ink:#2b2200; --terra:#a65a32;
  --danger:#b3261e; --danger-bg:#fbe5e2; --warn:#8f5b00; --warn-bg:#fdf0d2; --ok:#2b7a4b; --ok-bg:#e0f1e5; --info:#28597f; --info-bg:#e2edf6;
  --shadow:0 1px 2px rgba(22,35,27,.06),0 4px 14px rgba(22,35,27,.05);
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --link:#2a6449;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#16201a; --surface-2:#1c2821; --ink:#e5ece6; --muted:#9bb0a2; --line:#2a3a31;
    --pasto:#123325; --pasto-2:#1d4a36; --pasto-ink:#e8f0e9; --pasto-soft:#20392c;
    --brinco:#f2c12e; --brinco-ink:#2b2200; --terra:#d98a5f;
    --danger:#ff9b90; --danger-bg:#3a1c19; --warn:#f3c76a; --warn-bg:#352a12; --ok:#86d3a2; --ok-bg:#1a3324; --info:#9cc6ec; --info-bg:#182a3a;
    --shadow:0 1px 2px rgba(0,0,0,.3); --link:#86d3a2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --surface-2:#1c2821; --ink:#e5ece6; --muted:#9bb0a2; --line:#2a3a31;
  --pasto:#123325; --pasto-2:#1d4a36; --pasto-ink:#e8f0e9; --pasto-soft:#20392c;
  --brinco:#f2c12e; --brinco-ink:#2b2200; --terra:#d98a5f;
  --danger:#ff9b90; --danger-bg:#3a1c19; --warn:#f3c76a; --warn-bg:#352a12; --ok:#86d3a2; --ok-bg:#1a3324; --info:#9cc6ec; --info-bg:#182a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3); --link:#86d3a2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--brinco);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Estrutura ---------- */
.app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:6;background:var(--pasto);color:var(--pasto-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:10px}
.marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.marca svg{flex:0 0 34px}
.marca b{font-family:var(--f-num);font-size:22px;letter-spacing:.04em;line-height:1}
.marca small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinal{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sinal i{width:8px;height:8px;border-radius:50%;background:#7fe0a3;display:inline-block}
.sinal.off i{background:var(--brinco)}
.perfil{background:rgba(255,255,255,.1);color:inherit;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 8px;font-size:13px;max-width:130px}
.perfil option{color:#16231b;background:#fff}
main{max-width:1080px;margin:0 auto;padding:18px 16px 110px}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.abas button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:600;border-radius:12px;cursor:pointer;min-width:0}
.abas button svg{width:24px;height:24px}
.abas button.on{color:var(--pasto-2)}
.abas button.on svg{background:var(--pasto-soft);border-radius:99px;padding:2px 12px;width:48px;box-sizing:content-box;margin:0 -12px}
:root[data-theme="dark"] .abas button.on{color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .abas button.on{color:var(--ok)}}
.folha{position:fixed;inset:0;z-index:9;background:rgba(10,20,14,.45);display:flex;align-items:flex-end}
.folha .card{width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));margin:0}
.folha .item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 10px;border:0;background:none;color:var(--ink);font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;text-align:left}
.folha .item:hover{background:var(--surface-2)}
.folha .item svg{width:22px;height:22px;color:var(--pasto-2)}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px 1fr}
  .top,.abas{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--pasto);color:var(--pasto-ink);padding:22px 14px}
  .side .marca{flex:0;margin:0 6px 22px}
  .side nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;opacity:.82;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;text-align:left}
  .side nav button svg{width:20px;height:20px}
  .side nav button:hover{background:rgba(255,255,255,.07);opacity:1}
  .side nav button.on{background:rgba(255,255,255,.12);opacity:1;font-weight:600;box-shadow:inset 3px 0 0 var(--brinco)}
  .side .rodape{display:flex;flex-direction:column;gap:8px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.12)}
  .side .perfil{max-width:none;width:100%}
  main{padding:28px 32px 48px}
}

/* ---------- Tipografia ---------- */
h1.tit{font-family:var(--f-num);font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1.1;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
h2{font-family:var(--f-num);font-weight:600;font-size:21px;margin:26px 0 10px;letter-spacing:.01em;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0}
.rot{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:13.5px}
.n,.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:18px;font-weight:600;margin-left:3px;color:var(--muted)}

/* ---------- Blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);min-width:0}
.grade{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.grade > .card{margin:0}
.grade.g3{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.grade.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.grade.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;gap:6px;margin:0}
.kpi .v{font-family:var(--f-num);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);line-height:1.3}
.barra{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.barra i{display:block;height:100%;background:var(--pasto-2);border-radius:99px}
.barra.alta i{background:var(--terra)}

.heroi{background:var(--pasto);color:var(--pasto-ink);border:0;position:relative;overflow:hidden;padding:20px}
.heroi::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(242,193,46,.22),transparent 70%)}
.heroi .rot{color:var(--pasto-ink);opacity:.75}
.heroi .big{font-size:48px;color:var(--pasto-ink)}
.heroi .big small{color:var(--pasto-ink);opacity:.7}
.heroi .linha{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:10px;font-size:14px;opacity:.9}
.heroi .b{background:var(--brinco);color:var(--brinco-ink);border-color:var(--brinco)}

/* Brinco: a etiqueta amarela de orelha que identifica o lote */
.brinco{flex:0 0 auto;width:44px;height:50px;background:var(--brinco);color:var(--brinco-ink);border-radius:12px 12px 16px 16px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--f-num);font-weight:700;font-size:17px;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.brinco::before{content:"";position:absolute;top:7px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.brinco.sm{width:34px;height:40px;font-size:14px;border-radius:10px 10px 13px 13px}
.brinco.sm::before{top:5px;width:8px;height:8px;margin-left:-4px}

.lote-cab{display:flex;gap:12px;align-items:center}
.lote-cab .nome{flex:1;min-width:0}
.lote-cab .nome h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 12px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-num);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}

/* Régua de engorda: entrada → hoje → abate */
.regua{position:relative;margin:6px 0 4px}
.regua .trilho{height:10px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 9px,var(--line) 9px 10px);border:1px solid var(--line);overflow:hidden}
.regua .trilho i{display:block;height:100%;background:linear-gradient(90deg,var(--pasto-2),var(--ok));border-radius:99px}
.regua .marcas{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Alertas */
.alertas{display:flex;flex-direction:column;gap:8px}
.alerta{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.4}
.alerta svg{flex:0 0 20px;width:20px;height:20px;margin-top:1px}
.alerta.danger{border-left-color:var(--danger)} .alerta.danger svg{color:var(--danger)}
.alerta.warn{border-left-color:var(--warn)} .alerta.warn svg{color:var(--warn)}
.alerta.info{border-left-color:var(--info)} .alerta.info svg{color:var(--info)}
.alerta.ok{border-left-color:var(--ok)} .alerta.ok svg{color:var(--ok)}
.alerta .txt{flex:1;min-width:0}
.alerta a{color:var(--link);font-weight:600;white-space:nowrap}
.aviso{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.aviso.warn{background:var(--warn-bg);color:var(--warn)}
.aviso.info{background:var(--info-bg);color:var(--info)}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.aviso.danger{background:var(--danger-bg);color:var(--danger)}

/* Tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* Botões e formulários */
.b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pasto-2);background:var(--pasto-2);color:#fff;padding:10px 16px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.b:hover{filter:brightness(1.08)}
.s{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.s:hover{background:var(--surface-2)}
.s.d{color:var(--danger)}
.s svg,.b svg{width:16px;height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.entre{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.entre > div{min-width:0}
form .f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:flex;flex-direction:column;font-size:13px;font-weight:600;color:var(--muted);gap:5px}
input,select,textarea{font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);width:100%}
input:focus,select:focus{border-color:var(--pasto-2);outline:none;box-shadow:0 0 0 3px var(--pasto-soft)}
.form{border-color:var(--pasto-2);border-width:2px}
.form h3{margin-bottom:12px}

/* Leitura de cocho */
.notas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.notas button{min-height:64px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;font-size:12px;cursor:pointer;padding:6px 2px;line-height:1.2}
.notas button b{display:block;font-family:var(--f-num);font-size:24px;line-height:1}
.notas button span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.notas button.sel{border-color:var(--pasto-2);background:var(--pasto-soft);box-shadow:inset 0 0 0 1px var(--pasto-2)}
.notas button:hover{border-color:var(--pasto-2)}
.cocho-fig{display:flex;gap:6px;align-items:flex-end;height:14px;margin:4px auto 4px;width:34px}
.trato-num{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 4px}
.trato-num .big{font-size:28px}
@media (min-width:700px){.trato-num .big{font-size:36px}}
details summary{cursor:pointer;color:var(--link);font-size:14px;font-weight:600;margin-top:8px}

/* Preços */
.preco .v{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.preco .u{font-size:12.5px;color:var(--muted)}
.tag-op{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.tag-op.venda{background:var(--ok-bg);color:var(--ok)}
.tag-op.compra{background:var(--info-bg);color:var(--info)}
.resultado{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
@media (min-width:700px){.resultado{grid-template-columns:repeat(4,minmax(0,1fr))}}

.vazio{text-align:center;padding:32px 16px}
.vazio svg{width:120px;height:auto;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:380px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:24px}}
.hide-sm{display:none}
@media (min-width:700px){.hide-sm{display:table-cell}}

/* Etapas, botões de opção e navegação curral a curral */
.segm{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px;overflow-x:auto}
.segm button,.segm .opt span{flex:1;white-space:nowrap;border:0;background:none;color:var(--muted);padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;display:block;text-align:center}
.segm button.on,.segm .opt input:checked + span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.segm .opt{flex:1;display:block;color:inherit;font-size:inherit;position:relative}
.segm .opt input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.segm.grande{flex-wrap:wrap}
.notas.grande button{min-height:84px;font-size:13px}
.notas.grande button b{font-size:30px}
.pontos{display:flex;gap:5px}
.pontos i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pontos i.ok{background:var(--ok)}
.pontos i.on{outline:2px solid var(--brinco);outline-offset:1px}
.hist{display:flex;gap:10px;align-items:flex-end;margin-top:8px;height:64px}
.hist div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.hist i{width:18px;border-radius:5px 5px 2px 2px;background:var(--ok)}
.hist i.n2{background:var(--brinco)} .hist i.n3,.hist i.n4{background:var(--danger)}
.nav-curral{position:relative;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:space-between;padding:10px 0;z-index:3}
.nav-curral.fixo{position:sticky}
.nav-curral .b,.nav-curral .s{flex:1;justify-content:center;padding:14px;font-size:16px}
.nav-curral .s[disabled]{opacity:.4}
@media (min-width:900px){.nav-curral{bottom:0}}
.barra-h{height:6px;border-radius:99px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden;position:relative;z-index:1}
.barra-h i{display:block;height:100%;background:var(--brinco)}
.b.ghost{background:transparent;color:var(--pasto-ink);border-color:rgba(255,255,255,.4)}
.b[disabled]{opacity:.45;cursor:not-allowed}
.grade.g3c{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats.ind{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.stats.ind b{font-size:19px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}}
.forn.feito{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-bg),var(--ok-bg)) padding-box}
.forn .b{padding:12px 16px}
.relatorio{white-space:pre-wrap;font:14px/1.55 var(--f-body);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.zap{color:#1a7f45}
textarea{font:15px/1.4 var(--f-body)}
code{background:var(--surface-2);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div>
    <header class="top" id="top"></header>
    <main id="app"></main>
  </div>
</div>
<nav class="abas" id="abas"></nav>

<script>
'use strict';
// ====================== Dados ======================
const CHAVE = 'aumcg-v1';
const UFS = {
  SP:'São Paulo', MS:'Mato Grosso do Sul', MT:'Mato Grosso', GO:'Goiás', MG:'Minas Gerais',
  PR:'Paraná', BA:'Bahia', TO:'Tocantins', RO:'Rondônia', PA:'Pará', MA:'Maranhão', RS:'Rio Grande do Sul'
};
// Referência inicial: Indicador do Boi Gordo CEPEA/B3 (SP), média de agosto/2026 = R$ 345,92/@.
// Demais estados e categorias são ESTIMATIVAS por diferencial regional típico. Confira e atualize.
const DIF_UF = {SP:1,MS:.97,MT:.95,GO:.97,MG:.98,PR:1,BA:.96,TO:.94,RO:.92,PA:.92,MA:.93,RS:.98};
function precosIniciais(){
  const porUF = {};
  for(const uf in UFS){
    const g = Math.round(345.92*DIF_UF[uf]*100)/100;
    porUF[uf] = { boiGordo:g, vacaGorda:Math.round(g*.93*100)/100, boiMagro:Math.round(g*1.05*100)/100, bezerro:Math.round(3300*DIF_UF[uf]/10)*10, estimado: uf!=='SP' };
  }
  porUF.SP.estimado = false;
  return { atualizadoEm:'2026-08-31', fonte:'CEPEA/B3 média ago/2026 (SP); demais UFs e categorias estimadas', porUF, historico:[] };
}
const REGRA_COCHO = [
  {nota:0, nome:'Limpo', ajuste:5}, {nota:1, nome:'Pouca sobra', ajuste:0}, {nota:2, nome:'Sobra média', ajuste:-5},
  {nota:3, nome:'Muita sobra', ajuste:-10}, {nota:4, nome:'Intocado', ajuste:-15},
];
function estadoInicial(){
  return {
    versao:2,
    config:{ papel:'gerente', uf:'SP', rendimento:52, msPctPV:2.3, nTratos:4, divisaoTratos:'30,20,25,25', capVagao:6000, outrosCabDia:3,
      m2PorCab:12, cmCochoPorCab:40, cmBebedouroPorCab:4, diasAviso:7, pesoAbate:540, urlPrecos:'', fazenda:'', lat:'', lon:'',
      regraCocho: REGRA_COCHO.map(r=>({...r})) },
    dietas:[], currais:[], lotes:[], pesagens:[], sanidade:[], ocorrencias:[], leituras:[],
    fornecimentos:[], estoque:{}, entradas:[], despesas:[], animais:[], movimentos:[], clima:null,
    precos: precosIniciais()
  };
}
let S;
function carregar(){
  try { const t = localStorage.getItem(CHAVE); S = t ? JSON.parse(t) : estadoInicial(); }
  catch(e){ S = estadoInicial(); }
  normalizar();
}
const chaveIngr = n => String(n||'').trim().toLowerCase();
function normalizar(){
  const base = estadoInicial();
  for(const k in base) if(S[k]===undefined) S[k]=base[k];
  for(const k in base.config) if(S.config[k]===undefined) S.config[k]=base.config[k];
  // Versão 1 guardava o estoque dentro de cada dieta; agora é um estoque único por ingrediente.
  for(const d of S.dietas) for(const i of d.ingredientes){
    const k = chaveIngr(i.nome);
    if(!S.estoque[k]) S.estoque[k] = {nome:i.nome, kg:num(i.estoque)};
    delete i.estoque;
  }
  S.versao = 2;
}
function salvar(){
  S.modificadoEm = new Date().toISOString();
  try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch(e){ toast('Não foi possível salvar no aparelho'); }
}
const id = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

// ====================== Utilidades ======================
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v,d=0) => (isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brl = v => (isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2 = v => (isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dias = (a,b) => Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const somaDias = (d,n) => { const x=new Date(d+'T12:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const dbr = d => d ? d.split('-').reverse().join('/') : '–';
const num = v => { const n = parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:0; };
function confirmar(msg, fn){
  const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="card"><p style="margin-top:0">${esc(msg)}</p><div class="row"><button class="b" id="cm-ok">Confirmar</button><button class="s" id="cm-no">Cancelar</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#cm-ok').onclick=()=>{d.remove();fn();}; d.querySelector('#cm-no').onclick=()=>d.remove();
}
function toast(m){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
const porId = (lista,i) => S[lista].find(x=>x.id===i);
const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
const nomeL = l => /^lote/i.test(l.nome)?esc(l.nome):'lote '+esc(l.nome);
const nomeC = c => /^curral/i.test(c.nome)?esc(c.nome):'Curral '+esc(c.nome);
const lotesAtivos = () => S.lotes.filter(l=>l.ativo!==false);
const ordemRota = l => { const c = porId('currais', l.curralId); return c ? num(c.ordem)||999 : 9999; };
const lotesRota = () => lotesAtivos().slice().sort((a,b)=>ordemRota(a)-ordemRota(b));
function divisao(){
  const n = Math.max(1, Math.round(num(S.config.nTratos)));
  let p = String(S.config.divisaoTratos||'').split(/[,;\s]+/).map(num).filter(x=>x>0);
  if(p.length!==n) p = Array(n).fill(100/n);
  const t = p.reduce((a,b)=>a+b,0);
  return p.map(x=>x/t);
}
const regra = nota => (S.config.regraCocho||REGRA_COCHO).find(r=>r.nota===num(nota)) || {ajuste:0, nome:''};

// ====================== Cálculos ======================
function cabecasAtuais(l){
  const baixas = S.ocorrencias.filter(o=>o.loteId===l.id && (o.tipo==='morte'||o.tipo==='saida')).reduce((s,o)=>s+num(o.cabecas),0);
  return Math.max(0, num(l.cabecas)-baixas);
}
function gmdLote(l){
  // GMD real pela última pesagem, se houver; senão o esperado.
  const ps = S.pesagens.filter(p=>p.loteId===l.id).sort((a,b)=>a.data<b.data?1:-1);
  if(ps[0] && dias(l.dataEntrada, ps[0].data)>=14) return (num(ps[0].pesoMedio)-num(l.pesoEntrada))/dias(l.dataEntrada, ps[0].data);
  return num(l.gmd);
}
function pesoAtual(l, data=hoje()){
  const ps = S.pesagens.filter(p=>p.loteId===l.id && p.data<=data).sort((a,b)=>a.data<b.data?1:-1);
  const ref = ps[0] ? {data:ps[0].data, peso:num(ps[0].pesoMedio)} : {data:l.dataEntrada, peso:num(l.pesoEntrada)};
  return ref.peso + gmdLote(l)*Math.max(0,dias(ref.data,data));
}
const diasCocho = l => Math.max(0, dias(l.dataEntrada, l.fechamento ? l.fechamento.data : hoje()));
function dietaAtual(l){
  // Plano de adaptação: troca de dieta conforme os dias de cocho.
  const plano = (l.plano||[]).filter(p=>p.dietaId && num(p.ateDia)>0).sort((a,b)=>num(a.ateDia)-num(b.ateDia));
  const d = diasCocho(l);
  for(const p of plano) if(d <= num(p.ateDia)) return porId('dietas', p.dietaId);
  return porId('dietas', l.dietaId);
}
function proximaTroca(l){
  const plano = (l.plano||[]).filter(p=>p.dietaId && num(p.ateDia)>0).sort((a,b)=>num(a.ateDia)-num(b.ateDia));
  const d = diasCocho(l);
  for(let i=0;i<plano.length;i++) if(d <= num(plano[i].ateDia)){
    const prox = plano[i+1] ? porId('dietas',plano[i+1].dietaId) : porId('dietas', l.dietaId);
    return {emDias: num(plano[i].ateDia)-d+1, dieta: prox};
  }
  return null;
}
function dietaInfo(d){
  // Inclusão em % da matéria seca (MS). kg de matéria natural (MN) por kg de MS = Σ incl/MS%.
  if(!d || !d.ingredientes.length) return {mnPorMs:0, msPct:0, custoKgMS:0, custoKgMN:0, somaIncl:0};
  let mnPorMs=0, custo=0, soma=0;
  for(const i of d.ingredientes){
    const f = num(i.inclusao)/100, ms = Math.max(.01,num(i.ms)/100);
    soma += num(i.inclusao); mnPorMs += f/ms; custo += (f/ms)*num(i.custo);
  }
  return {mnPorMs, msPct: mnPorMs?100/mnPorMs:0, custoKgMS:custo, custoKgMN: mnPorMs?custo/mnPorMs:0, somaIncl:soma};
}
function tratoLote(l){
  const d = dietaAtual(l), di = dietaInfo(d);
  const cab = cabecasAtuais(l), pv = pesoAtual(l);
  const msCab = pv*num(S.config.msPctPV)/100*(1+num(l.ajuste||0)/100);
  const msTotal = msCab*cab, mnTotal = msTotal*di.mnPorMs;
  const ingr = d ? d.ingredientes.map(i=>({nome:i.nome, kg: msTotal*(num(i.inclusao)/100)/Math.max(.01,num(i.ms)/100)})) : [];
  return {cab, pv, msCab, msTotal, mnTotal, mnCab: cab?mnTotal/cab:0, custoDia: msTotal*di.custoKgMS, custoCab: msCab*di.custoKgMS, ingr, dieta:d, di};
}
const fornDoDia = (loteId, data=hoje()) => S.fornecimentos.filter(f=>f.loteId===loteId && f.data===data);
function previstoTrato(l, k){
  // Divide o total do dia pelos tratos (% por horário). Se um trato anterior saiu a mais ou a menos, o restante é redistribuído.
  const t = tratoLote(l), p = divisao(), feitos = fornDoDia(l.id);
  if(feitos.some(f=>f.trato===k)) return feitos.find(f=>f.trato===k).kgPrevisto;
  const entregue = feitos.reduce((s,f)=>s+num(f.kgReal),0);
  const restantes = p.map((x,i)=>i).filter(i=>!feitos.some(f=>f.trato===i+1));
  const pesoRest = restantes.reduce((s,i)=>s+p[i],0);
  return Math.max(0, (t.mnTotal - entregue) * p[k-1] / (pesoRest||1));
}
function capacidadeCurral(c){
  const area = Math.floor(num(c.area)/Math.max(.1,num(S.config.m2PorCab)));
  const cocho = Math.floor(num(c.cocho)*100/Math.max(1,num(S.config.cmCochoPorCab)));
  const beb = Math.floor(num(c.bebedouro)/Math.max(.1,num(S.config.cmBebedouroPorCab)));
  const lims = [{n:'area',v:area},{n:'cocho',v:cocho}];
  if(num(c.bebedouro)>0) lims.push({n:'bebedouro',v:beb});
  const min = lims.reduce((a,b)=>b.v<a.v?b:a);
  const ocup = lotesAtivos().filter(l=>l.curralId===c.id).reduce((s,l)=>s+cabecasAtuais(l),0);
  return {area, cocho, beb, max:min.v, limitante:min.n, ocup};
}
function estoqueDias(){
  const cons = {};
  for(const l of lotesAtivos()) for(const i of tratoLote(l).ingr){ const k=chaveIngr(i.nome); cons[k] = (cons[k]||0)+i.kg; }
  return Object.entries(S.estoque).map(([k,e])=>({chave:k, nome:e.nome, consumo:cons[k]||0, estoque:num(e.kg), dias: cons[k]>0 ? num(e.kg)/cons[k] : Infinity}));
}
function baixarEstoque(dieta, kgMN, sinal=1){
  if(!dieta) return;
  const di = dietaInfo(dieta);
  for(const i of dieta.ingredientes){
    const k = chaveIngr(i.nome), frac = (num(i.inclusao)/100/Math.max(.01,num(i.ms)/100))/Math.max(.0001,di.mnPorMs);
    if(!S.estoque[k]) S.estoque[k] = {nome:i.nome, kg:0};
    S.estoque[k].kg = num(S.estoque[k].kg) - sinal*kgMN*frac;
  }
}
function precoUF(){ return S.precos.porUF[S.config.uf] || S.precos.porUF.SP; }

// Indicadores zootécnicos e econômicos de um lote
function indicadores(l){
  const p = precoUF(), cab = l.fechamento ? num(l.fechamento.cabecas) : cabecasAtuais(l), pv = l.fechamento ? num(l.fechamento.peso) : pesoAtual(l), rend = num(S.config.rendimento)/100;
  const dc = Math.max(1, diasCocho(l)), g = gmdLote(l), t = tratoLote(l);
  const forn = S.fornecimentos.filter(f=>f.loteId===l.id);
  const diasComForn = new Set(forn.map(f=>f.data)).size;
  const custoForn = forn.reduce((s,f)=>s+num(f.kgReal)*num(f.custoKgMN),0);
  const mnReal = forn.reduce((s,f)=>s+num(f.kgReal),0);
  const msReal = forn.reduce((s,f)=>s+num(f.kgReal)*num(f.msPct)/100,0);
  // Dias sem registro de trato são estimados pelo previsto.
  const diasSem = Math.max(0, dc - diasComForn);
  const custoAlim = custoForn + diasSem*t.custoDia;
  const cmsCab = diasComForn ? msReal/diasComForn/Math.max(1,cab) : t.msCab;
  const pvMedio = (num(l.pesoEntrada)+pv)/2;
  const despesas = S.despesas.filter(d=>d.loteId===l.id).reduce((s,d)=>s+num(d.valor),0);
  const outros = num(S.config.outrosCabDia)*cab*dc + despesas;
  const compra = num(l.custoCompra) || (num(l.pesoEntrada)/30*p.boiMagro*num(l.cabecas));
  const arrobasEntrada = num(l.pesoEntrada)*rend/15; // mesma base de rendimento: @ produzidas = ganho de peso em carcaça
  const arrobasHoje = pv*rend/15;
  const arrobasProd = Math.max(0, (arrobasHoje-arrobasEntrada)*cab);
  const custoProd = custoAlim + outros;
  const custoCabDia = (t.custoCab + num(S.config.outrosCabDia));
  const custoProxArroba = g>0 ? custoCabDia/(g*rend/15) : Infinity;
  const alvo = num(l.pesoAbate)||num(S.config.pesoAbate);
  const diasAbate = g>0 ? Math.max(0,Math.ceil((alvo-pv)/g)) : null;
  const vendaHoje = arrobasHoje*cab*p.boiGordo;
  const vendaAlvo = alvo*rend/15*cab*p.boiGordo;
  const custoAteAlvo = custoProd + custoCabDia*cab*(diasAbate||0);
  const morte = S.ocorrencias.filter(o=>o.loteId===l.id && o.tipo==='morte').reduce((s,o)=>s+num(o.cabecas),0);
  return {cab, pv, g, dc, cmsCab, cmsPct: cmsCab/Math.max(1,pvMedio)*100, conversao: g>0 ? cmsCab/g : null,
    custoAlim, outros, despesas, compra, custoProd, custoCabDia, custoArroba: arrobasProd>0 ? custoProd/arrobasProd : null,
    arrobasProd, arrobasHoje: arrobasHoje*cab, custoProxArroba, diasAbate, dataAbate: diasAbate!=null?somaDias(hoje(),diasAbate):null,
    vendaHoje, vendaAlvo, margemHoje: vendaHoje-compra-custoProd, margemAlvo: vendaAlvo-compra-custoAteAlvo,
    reposicao: num(l.pesoEntrada)/30*p.boiMagro*cab, mortalidade: num(l.cabecas)? morte/num(l.cabecas)*100 : 0, diasComForn};
}
// Compatibilidade com telas antigas
function valorLote(l){ const i = indicadores(l); return {cab:i.cab, pv:i.pv, arrobas:i.arrobasHoje, venda:i.vendaHoje, compra:i.compra, reposicao:i.reposicao, diasAbate:i.diasAbate, dataAbate:i.dataAbate, vendaAlvo:i.vendaAlvo, margem:i.margemAlvo, diasCocho:diasCocho(l)}; }

// ====================== Sanidade ======================
const PROTOCOLO_PADRAO = [
  {dia:0, tipo:'Vacina', produto:'Clostridioses (polivalente)', carencia:0},
  {dia:30, tipo:'Vacina', produto:'Clostridioses – reforço', carencia:0},
  {dia:0, tipo:'Vacina', produto:'Doenças respiratórias (IBR/BVD/PI3/BRSV)', carencia:0},
  {dia:21, tipo:'Vacina', produto:'Doenças respiratórias – reforço', carencia:0},
  {dia:0, tipo:'Vermífugo', produto:'Endo/ectoparasiticida (conforme prescrição)', carencia:35},
  {dia:0, tipo:'Outro', produto:'Identificação, pesagem e triagem de entrada', carencia:0},
];
function aplicarProtocolo(l){
  for(const p of PROTOCOLO_PADRAO){
    S.sanidade.push({id:id(), loteId:l.id, data:somaDias(l.dataEntrada,p.dia), tipo:p.tipo, produto:p.produto, carencia:p.carencia, feito:false, obs:'Sugestão do protocolo padrão. Confirme com o veterinário.'});
  }
}
function carenciaAte(l){
  let fim=null;
  for(const s of S.sanidade) if(s.loteId===l.id && s.feito && num(s.carencia)>0){
    const f = somaDias(s.dataFeito||s.data, num(s.carencia)); if(!fim||f>fim) fim=f;
  }
  return fim;
}
// Índice de Temperatura e Umidade (ITU) para bovinos de corte
const itu = (t, ur) => 0.8*t + (ur/100)*(t-14.4) + 46.4;
const faixaITU = v => v>=84?{n:'danger',t:'emergência'}: v>=79?{n:'danger',t:'perigo'}: v>=72?{n:'warn',t:'alerta'}:{n:'ok',t:'conforto'};

// ====================== Alertas ======================
function alertas(){
  const A = [], h = hoje(), aviso = num(S.config.diasAviso), p = precoUF();
  for(const s of S.sanidade){
    if(s.feito) continue;
    const l = porId('lotes', s.loteId); if(!l || l.ativo===false) continue;
    const dd = dias(h, s.data);
    if(dd<0) A.push({n:'danger', t:`<b>${esc(s.tipo)} atrasado</b> em ${nomeL(l)}: ${esc(s.produto)} (previsto ${dbr(s.data)}). Aplicar e marcar como feito.`, aba:'sanidade'});
    else if(dd<=aviso) A.push({n:'warn', t:`<b>${esc(s.tipo)}</b> em ${nomeL(l)} ${dd===0?'<b>hoje</b>':'em '+dd+' dia(s)'}: ${esc(s.produto)}.`, aba:'sanidade'});
  }
  const enf = S.animais.filter(a=>a.status==='enfermaria');
  if(enf.length) A.push({n:'warn', t:`<b>${enf.length} animal(is) na enfermaria</b>. Revisar tratamento e dar alta ou registrar o desfecho.`, aba:'sanidade'});
  for(const l of lotesAtivos()){
    const i = indicadores(l), car = carenciaAte(l);
    if(car && car>=h){
      if(i.dataAbate && car>i.dataAbate) A.push({n:'danger', t:`<b>Carência</b> de ${nomeL(l)} vai até ${dbr(car)}, depois do abate previsto (${dbr(i.dataAbate)}). O embarque fica bloqueado até lá.`, aba:'sanidade'});
      else A.push({n:'info', t:`${cap(nomeL(l))} em <b>carência</b> até ${dbr(car)}. Embarque bloqueado até essa data.`, aba:'sanidade'});
    }
    const ls = S.leituras.filter(x=>x.loteId===l.id).sort((a,b)=>a.data<b.data?1:-1);
    if(ls.length>=2 && num(ls[0].nota)>=3 && num(ls[1].nota)>=3 && dias(ls[0].data,h)<=2) A.push({n:'danger', t:`${cap(nomeL(l))} com <b>sobra alta em leituras seguidas</b>. O trato já foi reduzido; chame o nutricionista e confira saúde e água.`, aba:'trato'});
    else if(ls[0] && dias(ls[0].data,h)<=1 && num(ls[0].nota)>=3) A.push({n:'warn', t:`<b>Queda de consumo</b> em ${nomeL(l)} (nota ${ls[0].nota}). Trato reduzido ${Math.abs(regra(ls[0].nota).ajuste)}%. Confira bebedouro e animais doentes.`, aba:'trato'});
    const doentes = S.ocorrencias.filter(o=>o.loteId===l.id && o.tipo==='doente' && dias(o.data,h)<=7).reduce((s,o)=>s+num(o.cabecas),0);
    if(doentes>0) A.push({n: doentes/Math.max(1,i.cab)>=.05?'danger':'warn', t:`<b>${doentes} animal(is) doente(s)</b> em ${nomeL(l)} nos últimos 7 dias.`, aba:'sanidade'});
    if(i.mortalidade>1) A.push({n:'danger', t:`Mortalidade de ${nomeL(l)} em <b>${nf(i.mortalidade,1)}%</b> (referência: até 1%).`, aba:'sanidade'});
    // Ponto ótimo de abate: quando produzir a próxima arroba custa mais do que ela vale.
    if(isFinite(i.custoProxArroba) && i.custoProxArroba > p.boiGordo && diasCocho(l)>30) A.push({n:'warn', t:`<b>Ponto de abate</b>: em ${nomeL(l)} a próxima @ custa ${brl2(i.custoProxArroba)} e vale ${brl2(p.boiGordo)}. Manter no cocho reduz o lucro; avalie vender.`, aba:'mercado'});
    else if(i.diasAbate===0) A.push({n:'ok', t:`${cap(nomeL(l))} atingiu o <b>peso de abate</b> (${nf(i.pv)} kg). Hora de negociar.`, aba:'mercado'});
    else if(i.diasAbate!=null && i.diasAbate<=15) A.push({n:'info', t:`${cap(nomeL(l))} chega ao peso de abate em ~${i.diasAbate} dias (${dbr(i.dataAbate)}). Comece a negociar a venda.`, aba:'mercado'});
    const pt = proximaTroca(l);
    if(pt && pt.emDias<=1 && pt.dieta) A.push({n:'info', t:`${cap(nomeL(l))} muda para a dieta <b>${esc(pt.dieta.nome)}</b> ${pt.emDias<=0?'hoje':'amanhã'} (plano de adaptação).`, aba:'trato'});
    const ultP = S.pesagens.filter(x=>x.loteId===l.id).sort((a,b)=>a.data<b.data?1:-1)[0];
    const refP = ultP?ultP.data:l.dataEntrada;
    if(dias(refP,h)>45) A.push({n:'info', t:`${cap(nomeL(l))} sem pesagem há ${dias(refP,h)} dias. Pese para corrigir o trato e o GMD.`, aba:'lotes'});
    if(!dietaAtual(l)) A.push({n:'warn', t:`${cap(nomeL(l))} sem dieta definida: não dá para calcular o trato.`, aba:'lotes'});
  }
  for(const c of S.currais){
    const k = capacidadeCurral(c);
    if(k.ocup>k.max) A.push({n:'danger', t:`<b>${nomeC(c)} superlotado</b>: ${k.ocup} cabeças para ${k.max} de capacidade (limitado por ${k.limitante==='area'?'área':k.limitante}). Transfira animais.`, aba:'capacidade'});
  }
  for(const e of estoqueDias()){
    if(e.consumo>0 && e.dias<7) A.push({n: e.dias<3?'danger':'warn', t:`<b>Estoque de ${esc(e.nome)}</b> dá para ${nf(Math.max(0,e.dias),1)} dia(s). Programe a compra.`, aba:'dietas'});
  }
  if(S.clima && S.clima.dias) for(const d of S.clima.dias.filter(x=>x.data>=h).slice(0,2)){
    const f = faixaITU(d.itu);
    if(f.n!=='ok') A.push({n:f.n, t:`<b>Calor ${d.data===h?'hoje':'amanhã'}</b>: ITU ${nf(d.itu)} (${f.t}), máxima de ${nf(d.tmax)} °C. Confira bebedouros e concentre o trato nas horas frescas.`, aba:'inicio'});
  }
  const idadePreco = dias(S.precos.atualizadoEm, h);
  if(idadePreco>7) A.push({n:'info', t:`Preços atualizados há ${idadePreco} dias. Atualize quando tiver sinal.`, aba:'mercado'});
  const ordem = {danger:0,warn:1,info:2,ok:3};
  return A.sort((a,b)=>ordem[a.n]-ordem[b.n]);
}

async function atualizarClima(silencioso){
  const lat = num(S.config.lat), lon = num(S.config.lon);
  if(!lat || !lon){ if(!silencioso) toast('Informe a localização da fazenda em Ajustes.'); return; }
  if(!navigator.onLine){ if(!silencioso) toast('Sem sinal. A previsão atualiza quando voltar.'); return; }
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m&forecast_days=3&timezone=auto`);
    const j = await r.json(); const por = {};
    j.hourly.time.forEach((t,i)=>{ const d=t.slice(0,10), T=j.hourly.temperature_2m[i], U=j.hourly.relative_humidity_2m[i], v=itu(T,U);
      if(!por[d]) por[d]={data:d, itu:0, tmax:-99}; por[d].itu=Math.max(por[d].itu,v); por[d].tmax=Math.max(por[d].tmax,T); });
    S.clima = {atualizadoEm:new Date().toISOString(), dias:Object.values(por)}; salvar(); if(!silencioso) toast('Previsão atualizada'); render();
  }catch(e){ if(!silencioso) toast('Não foi possível buscar a previsão do tempo.'); }
}
function usarLocalizacao(){
  if(!navigator.geolocation) return toast('Localização indisponível neste aparelho.');
  navigator.geolocation.getCurrentPosition(p=>{ S.config.lat=p.coords.latitude.toFixed(4); S.config.lon=p.coords.longitude.toFixed(4); salvar(); toast('Localização salva'); render(); atualizarClima(true); }, ()=>toast('Não foi possível obter a localização.'));
}
function cardClima(){
  if(!S.clima || !S.clima.dias) return num(S.config.lat) ? `<div class="card entre"><span class="muted">${ico('sol','style="width:18px;vertical-align:-4px"')} Previsão de calor ainda não carregada.</span><button class="s" onclick="atualizarClima()">Buscar previsão</button></div>` : '';
  const ds = S.clima.dias.filter(d=>d.data>=hoje()).slice(0,3);
  return `<div class="card"><div class="entre"><span class="rot">${ico('sol','style="width:16px;vertical-align:-3px"')} Estresse por calor (ITU)</span><button class="s" onclick="atualizarClima()">Atualizar</button></div>
  <div class="grade g3c" style="margin:10px 0 0">${ds.map(d=>{ const f=faixaITU(d.itu); return `<div><span class="muted">${d.data===hoje()?'Hoje':new Date(d.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short'})}</span><div class="big" style="font-size:26px">${nf(d.itu)}</div><span class="chip ${f.n}">${f.t} · ${nf(d.tmax)} °C</span></div>`; }).join('')}</div></div>`;
}

// ---------- Trato: leitura de cocho (passa curral), registro do trato e ordem do vagão ----------
function mudarModoTrato(m){ modoTrato=m; render(); }
V.trato = () => {
  const ls = lotesRota();
  if(!ls.length) return `${titulo('Trato e cocho')}<div class="card vazio"><p>Nenhum lote ativo.</p><button class="b" onclick="ir('lotes')">Cadastrar lote</button></div>`;
  const modos = [['leitura','1 · Cocho'],['vagao','2 · Vagão'],['trato','3 · Entrega']];
  let corpo = modoTrato==='vagao' ? telaVagao(ls) : modoTrato==='trato' ? telaFornecimento(ls) : telaLeitura(ls);
  return `${titulo('Trato e cocho', cap(dataExtenso())+' · currais na ordem da rota')}${segm(modos, modoTrato, 'mudarModoTrato')}${corpo}`;
};
function telaLeitura(ls){
  idxLeitura = Math.max(0, Math.min(idxLeitura, ls.length-1));
  const l = ls[idxLeitura], t = tratoLote(l), c = porId('currais', l.curralId);
  const ult = S.leituras.filter(x=>x.loteId===l.id).sort((a,b)=>a.data<b.data?1:-1);

function lerCocho(loteId, nota, avancar){
  const l = porId('lotes', loteId), aj = regra(nota).ajuste;
  const anterior = S.leituras.find(x=>x.loteId===loteId && x.data===hoje());
  if(anterior) l.ajuste = num(l.ajuste) - regra(anterior.nota).ajuste; // trocar a nota do dia não acumula
  l.ajuste = Math.max(-30, Math.min(30, num(l.ajuste)+aj));
  const obs = anterior ? anterior.obs : '';
  S.leituras = S.leituras.filter(x=>!(x.loteId===loteId && x.data===hoje()));
  S.leituras.push({id:id(), loteId, data:hoje(), nota, obs});
  salvar(); toast(`Nota ${nota} · trato ${aj>0?'+':''}${aj}%`);
  if(avancar && idxLeitura < lotesRota().length-1) idxLeitura++;
  render();
}
function obsCocho(loteId, v){ const x = S.leituras.find(y=>y.loteId===loteId && y.data===hoje()); if(x){ x.obs=v; salvar(); } else toast('Escolha a nota primeiro.'); }
function escolherTrato(k){ tratoSel = num(k); render(); }
function telaVagao(ls){
  const n = divisao().length, cap = Math.max(100, num(S.config.capVagao));
  const grupos = {};
  for(const l of ls){ const d = dietaAtual(l); if(!d) continue; (grupos[d.id] = grupos[d.id] || {dieta:d, lotes:[]}).lotes.push({l, kg:previstoTrato(l,tratoSel), feito: fornDoDia(l.id).some(f=>f.trato===tratoSel)}); }
  const blocos = Object.values(grupos).map(g=>{
    const total = g.lotes.reduce((s,x)=>s+x.kg,0), di = dietaInfo(g.dieta);
    const nb = Math.max(1, Math.ceil(total/cap));
    // Distribui os currais em batidas sem passar da capacidade do vagão
    const batidas = Array.from({length:nb},()=>({lotes:[], kg:0}));
    let b=0; for(const x of g.lotes){ let resto=x.kg; while(resto>0.5){ const livre = cap - batidas[b].kg; if(livre<=0.5){ b=Math.min(b+1,nb-1); if(batidas[b].kg>=cap){ batidas.push({lotes:[],kg:0}); b=batidas.length-1; } continue; } const q=Math.min(livre,resto); batidas[b].lotes.push({...x, kg:q}); batidas[b].kg+=q; resto-=q; } }
    return batidas.filter(bt=>bt.kg>0).map((bt,bi,arr)=>{
      let acum=0;
      const carga = g.dieta.ingredientes.map(i=>{ const kg = bt.kg*(num(i.inclusao)/100/Math.max(.01,num(i.ms)/100))/Math.max(.0001,di.mnPorMs); acum+=kg; return {nome:i.nome, kg, acum}; });
      return `<div class="card"><div class="entre"><h3>${esc(g.dieta.nome)}${arr.length>1?` · batida ${bi+1} de ${arr.length}`:''}</h3><span class="chip">${nf(bt.kg)} kg</span></div>
      <p class="rot" style="margin:14px 0 6px">Ordem de carregamento</p>
      <div class="tw"><table><tr><th>#</th><th>Ingrediente</th><th class="n">kg</th><th class="n">Balança marca</th></tr>${carga.map((c,i)=>`<tr><td class="num">${i+1}</td><td>${esc(c.nome)}</td><td class="n">${nf(c.kg)}</td><td class="n"><b>${nf(c.acum)}</b></td></tr>`).join('')}</table></div>
      <p class="rot" style="margin:14px 0 6px">Descarregar na rota</p>
      <div class="tw"><table><tr><th>Curral</th><th>Lote</th><th class="n">kg</th><th></th></tr>${bt.lotes.map(x=>{ const c=porId('currais',x.l.curralId); return `<tr><td>${c?esc(c.nome):'–'}</td><td><span class="brinco sm" style="display:inline-flex;vertical-align:middle;margin-right:6px">${codigoLote(x.l)}</span>${esc(x.l.nome)}</td><td class="n"><b>${nf(x.kg)}</b></td><td>${x.feito?'<span class="chip ok">entregue</span>':''}</td></tr>`; }).join('')}</table></div></div>`;
    }).join('');
  }).join('');
  return `<div class="entre" style="margin-bottom:10px">${segm(Array.from({length:n},(_, i)=>[String(i+1),`${i+1}º trato`]), String(tratoSel), 'escolherTrato')}<span class="muted">vagão de ${nf(cap)} kg</span></div>
  ${blocos||'<div class="card muted">Nenhum lote com dieta definida.</div>'}
  <div class="nav-curral"><button class="s" onclick="mudarModoTrato('leitura')">${ico('volta')}Leitura</button><button class="b" onclick="mudarModoTrato('trato')">Registrar entrega${ico('seta')}</button></div>`;
}
function telaFornecimento(ls){
  const n = divisao().length;

    const kg = previstoTrato(l, tratoSel), f = fornDoDia(l.id).find(x=>x.trato===tratoSel), c = porId('currais', l.curralId);
    const dia = fornDoDia(l.id); prevTot += tratoLote(l).mnTotal; realTot += dia.reduce((s,x)=>s+num(x.kgReal),0);
    const desvio = f ? (num(f.kgReal)-num(f.kgPrevisto))/Math.max(1,num(f.kgPrevisto))*100 : 0;
    return `<div class="card forn ${f?'feito':''}">

      ${f?`<div class="row" style="margin-top:10px"><button class="s" onclick="desfazerTrato('${f.id}')">Desfazer</button></div>`:`
      <div class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="kg-${l.id}" inputmode="decimal" placeholder="${nf(kg)}" aria-label="kg entregues" style="flex:1">
      <button class="b" onclick="registrarTrato('${l.id}',${tratoSel},${kg.toFixed(1)})">${ico('ok')}Entregue</button></div>
      <p class="muted" style="margin:6px 0 0">Deixe vazio para confirmar o previsto.</p>`}</div>`;
  }).join('');
  const dif = prevTot ? (realTot-prevTot)/prevTot*100 : 0;
  return `<div class="entre" style="margin-bottom:10px">${segm(Array.from({length:n},(_, i)=>[String(i+1),`${i+1}º trato`]), String(tratoSel), 'escolherTrato')}</div>

  <p class="muted" style="margin:10px 0 0">Se um trato sair a mais ou a menos, os próximos são corrigidos sozinhos. Cada entrega dá baixa no estoque.</p></div>

function registrarTrato(loteId, k, prev){

function desfazerTrato(fid){

function salvarAnimais(ev, lid){
  const d = dadosForm(ev); let n=0;
  for(const linha of String(d.lista||'').split(/\n+/)){ const [b,p,q] = linha.split(/[;,\t]/).map(x=>(x||'').trim()); if(!b) continue;

    S.animais.push({id:id(), loteId:lid, brinco:b, qr:q||'', pesoEntrada:p?num(p):'', status:'ativo', historico:[{data:hoje(), txt:'Entrada no lote'}]}); n++; }
  salvar(); toast(`${n} animal(is) adicionados`); editando={tipo:'animais', id:lid}; render();
}
function salvarFaixa(ev, lid){
  const d = dadosForm(ev), de = Math.floor(num(d.de)), ate = Math.floor(num(d.ate));
  if(!(ate>=de) || ate-de>2000){ toast('Faixa inválida'); return; }
  let n=0; for(let b=de; b<=ate; b++){ if(S.animais.some(a=>a.loteId===lid && a.brinco===String(b))) continue;
    S.animais.push({id:id(), loteId:lid, brinco:String(b), qr:'', pesoEntrada:'', status:'ativo', historico:[{data:hoje(), txt:'Entrada no lote'}]}); n++; }
  salvar(); toast(`${n} animais cadastrados (${de} a ${ate})`); editando={tipo:'animais', id:lid}; render();
}

function fecharLote(ev, lid){
  const d = dadosForm(ev), l = porId('lotes', lid), car = carenciaAte(l);
  if(car && car>d.data) return toast('Lote em carência: embarque bloqueado.');
  const i = indicadores(l);
  const arrobas = num(d.peso)*num(d.rend)/100/15*num(d.cabecas);
  const receita = arrobas*num(d.preco) - num(d.descontos);
  const custo = i.compra + i.custoAlim + i.outros;
  l.fechamento = {data:d.data, cabecas:num(d.cabecas), peso:num(d.peso), rend:num(d.rend), preco:num(d.preco), descontos:num(d.descontos), arrobas, receita,
    compra:i.compra, alimentacao:i.custoAlim, outros:i.outros, custo, lucro:receita-custo, dias:diasCocho(l), gmd:(num(d.peso)-num(l.pesoEntrada))/Math.max(1,dias(l.dataEntrada,d.data)),
    cms:i.cmsCab, conversao:i.conversao, custoArroba:i.custoArroba};
  l.ativo = false;
  S.ocorrencias.push({id:id(), loteId:lid, data:d.data, tipo:'saida', cabecas:num(d.cabecas), descricao:`Venda: ${nf(arrobas)} @ a ${brl2(num(d.preco))}`});
  S.animais.filter(a=>a.loteId===lid && a.status==='ativo').forEach(a=>a.status='vendido');
  salvar(); toast('Lote fechado'); editando={tipo:'relatorio', id:lid}; render();
}

function grafico(h){
  const W=600,H=140,P=28, vs=h.map(x=>x.boiGordo), mn=Math.min(...vs)*.98, mx=Math.max(...vs)*1.02;
  const x=i=>P+i*(W-2*P)/Math.max(1,h.length-1), y=v=>H-P-(v-mn)/(mx-mn||1)*(H-2*P);
  const pts=h.map((d,i)=>`${x(i)},${y(d.boiGordo)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px" role="img" aria-label="Histórico do boi gordo">
  <polygon points="${x(0)},${H-P} ${pts} ${x(h.length-1)},${H-P}" fill="var(--pasto-soft)"/>
  <polyline points="${pts}" fill="none" stroke="var(--pasto-2)" stroke-width="2.5"/>
  ${h.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.boiGordo)}" r="${i===h.length-1?5:3}" fill="${i===h.length-1?'var(--brinco)':'var(--pasto-2)'}"/>`).join('')}
  <text x="${x(h.length-1)}" y="${y(vs[vs.length-1])-10}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)">${brl2(vs[vs.length-1])}</text>
  <text x="${P}" y="${H-8}" font-size="11" fill="var(--muted)">${dbr(h[0].data)}</text><text x="${W-P}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${dbr(h[h.length-1].data)}</text></svg>`;
}

async function buscarPrecos(){
  // Espera um JSON { "data":"AAAA-MM-DD", "fonte":"...", "porUF": { "SP": {boiGordo, vacaGorda, boiMagro, bezerro}, ... } }
  if(!navigator.onLine) return toast('Sem sinal. Usando os últimos preços salvos.');

// ---------- Simulador de compra ----------
let SIM = null;
function simPadrao(){
  const p = precoUF(), ls = lotesAtivos();
  const custoCab = ls.length ? ls.reduce((s,l)=>s+tratoLote(l).custoCab,0)/ls.length : 14;
  return {cab:100, peso:380, precoCompra:p.boiMagro, gmd:1.5, pesoAbate:num(S.config.pesoAbate), racao:Math.round(custoCab*100)/100, outros:num(S.config.outrosCabDia), precoVenda:p.boiGordo, rend:num(S.config.rendimento)};
}
function calcSim(s){
  const dias = Math.max(0, Math.ceil((s.pesoAbate-s.peso)/Math.max(.1,s.gmd)));
  const compraCab = s.peso/30*s.precoCompra;
  const arrobasSaida = s.pesoAbate*s.rend/100/15;
  const vendaCab = arrobasSaida*s.precoVenda;
  const custoCocho = (s.racao+s.outros)*dias;
  const lucroCab = vendaCab - compraCab - custoCocho;
  const arrobasProd = arrobasSaida - s.peso*s.rend/100/15;
  const equilibrio = (compraCab+custoCocho)/Math.max(.1,arrobasSaida);
  return {dias, compraCab, vendaCab, custoCocho, lucroCab, lucroTotal:lucroCab*s.cab, margem: lucroCab/Math.max(1,compraCab+custoCocho)*100, equilibrio, custoArrobaProd: custoCocho/Math.max(.1,arrobasProd), saida: somaDias(hoje(),dias)};
}
V.simular = () => {
  if(!SIM) SIM = simPadrao();
  const s = SIM, r = calcSim(s);
  const campo = (k,rot) => `<label>${rot}<input id="sim-${k}" inputmode="decimal" value="${s[k]}" oninput="SIM.${k}=num(this.value);atualizarSim()"></label>`;
  return `${titulo('Simular compra', 'Vale a pena confinar este lote agora? Mude os números e veja o resultado na hora.')}
  <div class="card"><div class="f" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    ${campo('cab','Cabeças')}${campo('peso','Peso de compra (kg)')}${campo('precoCompra','Preço de compra (R$/@ vivo)')}${campo('gmd','GMD esperado (kg/dia)')}
    ${campo('pesoAbate','Peso de abate (kg)')}${campo('rend','Rendimento de carcaça (%)')}${campo('racao','Ração (R$/cab/dia)')}${campo('outros','Outros custos (R$/cab/dia)')}${campo('precoVenda','Preço de venda (R$/@)')}
  </div>
  <div id="sim-res">${resSim(r,s)}</div>
  <div class="row" style="margin-top:12px"><button class="s" onclick="SIM=simPadrao();render()">Voltar aos números da fazenda</button></div></div>
  <p class="muted">Ração por cabeça começa pela média dos seus lotes de hoje e "outros custos" pelo valor de Ajustes. Preço de equilíbrio é o preço de venda que zera o lucro.</p>`;
};
function resSim(r,s){
  const bom = r.lucroCab>=0;
  return `<div class="resultado">
    <div class="kpi"><span class="rot">Lucro por cabeça</span><span class="v" style="color:${bom?'var(--ok)':'var(--danger)'}">${brl(r.lucroCab)}</span><span class="l">margem de ${nf(r.margem,1)}%</span></div>
    <div class="kpi"><span class="rot">Lucro do lote</span><span class="v" style="color:${bom?'var(--ok)':'var(--danger)'}">${brl(r.lucroTotal)}</span><span class="l">${nf(s.cab)} cabeças</span></div>
    <div class="kpi"><span class="rot">Dias de cocho</span><span class="v">${r.dias}</span><span class="l">saída em ${dbr(r.saida)}</span></div>
    <div class="kpi"><span class="rot">Preço de equilíbrio</span><span class="v">${brl2(r.equilibrio)}</span><span class="l">por @ (hoje: ${brl2(s.precoVenda)})</span></div>
  </div>
  <div class="tw" style="margin-top:12px"><table>
    <tr><td>Compra por cabeça</td><td class="n">${brl(r.compraCab)}</td></tr>
    <tr><td>Custo no cocho por cabeça (${r.dias} dias)</td><td class="n">${brl(r.custoCocho)}</td></tr>
    <tr><td>Venda por cabeça</td><td class="n">${brl(r.vendaCab)}</td></tr>
    <tr><td>Custo da arroba produzida (aprox.)</td><td class="n">${brl2(r.custoArrobaProd)}</td></tr></table></div>`;
}

function salvarCompra(ev){
  const d = dadosForm(ev), k = chaveIngr(d.nome), e = S.estoque[k] || (S.estoque[k]={nome:d.nome, kg:0});
  const precoAnt = (S.dietas.flatMap(x=>x.ingredientes).find(i=>chaveIngr(i.nome)===k)||{}).custo;
  if(num(d.preco)>0){
    // custo médio ponderado entre o que sobrou e o que chegou
    const medio = (Math.max(0,num(e.kg))*num(precoAnt) + num(d.kg)*num(d.preco)) / Math.max(1, Math.max(0,num(e.kg))+num(d.kg));
    for(const x of S.dietas) for(const i of x.ingredientes) if(chaveIngr(i.nome)===k) i.custo = Math.round(medio*1000)/1000;
  }
  e.kg = num(e.kg) + num(d.kg);
  S.entradas.push({id:id(), data:d.data, nome:d.nome, kg:num(d.kg), preco:num(d.preco)});
  salvar(); editando=null; toast('Entrada registrada'); render();
}

const normBrinco = b => String(b||'').trim().replace(/\s+/g,'').toUpperCase();
function acharAnimal(cod){
  const k = normBrinco(cod); if(!k) return null;
  const vivos = S.animais.filter(a=>a.status!=='morto' && a.status!=='vendido');
  return vivos.find(a=>normBrinco(a.brinco)===k || normBrinco(a.qr)===k)
    // SISBOV/PNIB: o QR costuma trazer os 15 dígitos e o manejo usa só o final.
    || (k.length>6 ? vivos.find(a=>normBrinco(a.brinco).length>=3 && k.endsWith(normBrinco(a.brinco))) : null)
    || S.animais.find(a=>normBrinco(a.brinco)===k || normBrinco(a.qr)===k) || null;
}
const ultimoPeso = a => (a.pesos&&a.pesos.length) ? a.pesos[a.pesos.length-1] : (a.pesoEntrada?{data:null,kg:num(a.pesoEntrada)}:null);
// Junta brincos numéricos em faixas: 150, 151, 152, 160 -> "150 a 152, 160"
function faixas(brincos){
  const ns = [...new Set(brincos.map(b=>String(b).trim()).filter(b=>/^\d+$/.test(b)).map(Number))].sort((a,b)=>a-b);
  const out = []; let ini = null, ant = null;
  for(const n of ns){ if(ini===null){ini=ant=n; continue;} if(n===ant+1){ant=n; continue;} out.push(ini===ant?`${ini}`:`${ini} a ${ant}`); ini=ant=n; }
  if(ini!==null) out.push(ini===ant?`${ini}`:`${ini} a ${ant}`);
  const outros = brincos.filter(b=>!/^\d+$/.test(String(b).trim())).length;
  return out.join(', ') + (outros?`${out.length?' + ':''}${outros} com outro formato`:'');
}
const faixaLote = l => faixas(S.animais.filter(a=>a.loteId===l.id && a.status!=='morto' && a.status!=='vendido').map(a=>a.brinco));

function moverAnimal(a, loteDestId, data, origem){
  if(!loteDestId || a.loteId===loteDestId) return false;
  const de = porId('lotes', a.loteId), para = porId('lotes', loteDestId); if(!para) return false;
  if(de && a.status!=='morto' && a.status!=='vendido') de.cabecas = Math.max(0, num(de.cabecas)-1);
  para.cabecas = num(para.cabecas)+1;
  S.movimentos.push({id:id(), loteId:para.id, animalId:a.id, data, de:de?de.curralId:'', para:para.curralId, cabecas:1, brinco:a.brinco});
  (a.historico=a.historico||[]).push({data, txt:`Mudou para ${para.nome}${origem?` (${origem})`:''}`});
  a.loteId = para.id; return true;
}
function pesarAnimal(a, kg, data, origem){
  if(!(kg>0)) return;
  (a.pesos=a.pesos||[]).push({data, kg, origem:origem||''});
  a.pesos.sort((x,y)=>x.data<y.data?-1:1);
  (a.historico=a.historico||[]).push({data, txt:`Peso ${nf(kg)} kg${origem?` (${origem})`:''}`});
}

// Câmera: usa o leitor de QR do próprio navegador (Android/Chrome). Sem ele, fica a digitação.
async function abrirCamera(){
  const box = document.getElementById('cam');
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices){ box.innerHTML = '<p class="muted">Este aparelho não lê QR pelo navegador. Use a câmera do celular para abrir o QR, ou digite o número.</p>'; return; }
  try{
    const det = new BarcodeDetector({formats:['qr_code','code_128','ean_13','data_matrix']});
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    box.innerHTML = '<video id="cam-v" playsinline muted style="width:100%;max-width:420px;border-radius:12px;background:#000"></video><div class="row" style="margin-top:8px"><button type="button" class="s" onclick="fecharCamera()">Fechar câmera</button></div>';
    const v = document.getElementById('cam-v'); v.srcObject = st; await v.play(); camAtiva = st;
    const loop = async () => {
      if(camAtiva!==st) return;
      try{ const r = await det.detect(v); if(r[0]){ fecharCamera(); lerBrinco(r[0].rawValue); return; } }catch(e){}
      setTimeout(loop, 250);
    }; loop();
  }catch(e){ box.innerHTML = '<p class="muted">Não foi possível abrir a câmera. Confira a permissão do navegador.</p>'; }
}
function fecharCamera(){ if(camAtiva){ camAtiva.getTracks().forEach(t=>t.stop()); camAtiva=null; } const b=document.getElementById('cam'); if(b) b.innerHTML=''; }

// --- Importação de leituras (câmera com IA, balança, bastão) ---
function lerArquivoLeituras(f){ if(!f) return; const r = new FileReader(); r.onload = () => previaLeituras(r.result); r.readAsText(f); }
function dataLeitura(s){
  s = String(s||'').trim(); if(!s) return hoje();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return hoje();
}
function linhasLeituras(txt){
  txt = String(txt||'').trim(); if(!txt) return [];
  if(/^[\[{]/.test(txt)){ try{ let j = JSON.parse(txt); if(!Array.isArray(j)) j = j.leituras||j.readings||j.data||[];
    return j.map(o=>{ const k = Object.keys(o); const pega = re => { const c = k.find(x=>re.test(x)); return c?o[c]:''; };
      return {brinco:pega(/brinco|tag|ear|animal|id|codigo|code/i), peso:pega(/peso|weight|kg/i), data:pega(/data|date|hora|time/i), local:pega(/local|curral|pen|camera|ponto|place|loc/i)}; }); }catch(e){ return []; } }
  const ls = txt.split(/\r?\n/).filter(x=>x.trim());
  const sep = [';','\t',','].find(s=>ls[0].includes(s)) || ';';
  let cols = ls[0].split(sep).map(x=>x.trim().toLowerCase().replace(/^"|"$/g,''));
  const idx = {brinco:0, peso:1, data:2, local:3};
  const temCab = cols.some(c=>/[a-z]/.test(c) && !/^\d/.test(c)) && !acharAnimal(cols[0]);
  if(temCab){
    const f = re => cols.findIndex(c=>re.test(c));
    idx.brinco = f(/brinco|tag|ear|animal|codigo|code|^id$/); idx.peso = f(/peso|weight|kg/); idx.data = f(/data|date|hora|time/); idx.local = f(/local|curral|pen|camera|câmera|ponto|place/);
    if(idx.brinco<0) idx.brinco = 0;
  }
  return ls.slice(temCab?1:0).map(l=>{ const p = l.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')); const g = i => i>=0 ? (p[i]||'') : '';
    return {brinco:g(idx.brinco), peso:g(idx.peso), data:g(idx.data), local:g(idx.local)}; });
}
function previaLeituras(txt){
  const rs = linhasLeituras(txt).filter(r=>String(r.brinco).trim());
  if(!rs.length){ toast('Nenhuma leitura encontrada no arquivo'); return; }
  const ls = lotesAtivos();
  importPrevia = rs.map(r=>{
    const a = acharAnimal(r.brinco), loc = String(r.local||'').trim(), kg = num(String(r.peso).replace(',','.'));
    const c = loc ? S.currais.find(c=>normBrinco(c.nome)===normBrinco(loc) || normBrinco(c.nome).endsWith(normBrinco(loc))) : null;
    let destino = '';
    if(a && c){ const l = porId('lotes', a.loteId); if(!l || l.curralId!==c.id){ const ld = ls.find(x=>x.curralId===c.id); destino = ld?ld.id:''; } }
    return {brinco:String(r.brinco).trim(), aid:a?a.id:'', kg:kg>0&&kg<2000?kg:0, data:dataLeitura(r.data), local:loc, destino, embarque:/embarq|caminh|saida|saída|truck/i.test(loc)};
  });
  render();
}
function painelPrevia(){
  const P = importPrevia, ok = P.filter(r=>r.aid), novos = P.filter(r=>!r.aid);
  return `<div style="margin-top:12px"><p><b>${P.length}</b> leituras: <b>${ok.length}</b> animais encontrados${novos.length?`, <b style="color:var(--warn)">${novos.length}</b> brinco(s) não cadastrado(s)`:''}. Data das leituras: ${[...new Set(P.map(r=>dbr(r.data)))].join(', ')}.</p>
  <div class="tw"><table><tr><th>Brinco</th><th>Lote hoje</th><th class="n">Peso</th><th>O que acontece</th></tr>${P.slice(0,12).map(r=>{const a=r.aid?porId('animais',r.aid):null, l=a?porId('lotes',a.loteId):null, ld=r.destino?porId('lotes',r.destino):null;
    const acts = []; if(r.kg) acts.push('registra peso'); if(ld) acts.push('muda p/ '+esc(ld.nome)); if(r.embarque) acts.push('anota no embarque'); if(r.local && !ld && !r.embarque && a) acts.push('anota local');
    return `<tr><td><b>${esc(r.brinco)}</b></td><td>${l?esc(l.nome):'<span class="muted">não cadastrado</span>'}</td><td class="n">${r.kg?nf(r.kg):'–'}</td><td>${a?(acts.join(', ')||'só confere'):'<span class="muted">ignorado</span>'}</td></tr>`;}).join('')}</table></div>
  ${P.length>12?`<p class="muted">Mostrando 12 de ${P.length} leituras.</p>`:''}
  ${novos.length?`<label style="margin-top:10px">Brincos não cadastrados<select id="br-novos" name="novos"><option value="">Ignorar</option>${lotesAtivos().map(l=>`<option value="${l.id}">Cadastrar no ${esc(l.nome)}</option>`).join('')}</select></label>`:''}
  <div class="row" style="margin-top:10px"><button class="b" onclick="aplicarLeituras()">Aplicar leituras</button><button class="s" onclick="importPrevia=null;render()">Cancelar</button></div></div>`;
}
function aplicarLeituras(){
  const P = importPrevia||[]; const sel = document.getElementById('br-novos'), loteNovo = sel?sel.value:'';
  let pesos=0, mov=0, novos=0; const tocados = new Set();
  for(const r of P){
    let a = r.aid ? porId('animais', r.aid) : null;
    if(!a && loteNovo){ a = {id:id(), loteId:loteNovo, brinco:r.brinco, pesoEntrada:r.kg||'', status:'ativo', historico:[{data:r.data, txt:'Cadastrado por leitura'}]}; S.animais.push(a); novos++; }
    if(!a) continue;
    const origem = r.local ? `leitura ${r.local}` : 'leitura';
    if(r.kg){ pesarAnimal(a, r.kg, r.data, origem); pesos++; tocados.add(a.loteId+'|'+r.data); }
    if(r.destino && moverAnimal(a, r.destino, r.data, origem)) mov++;
    else if(r.local && !r.kg) (a.historico=a.historico||[]).push({data:r.data, txt:r.embarque?(/^embarque$/i.test(r.local)?'Lido no embarque':`Lido no embarque (${r.local})`):`Lido em ${r.local}`});
  }
  // Se a maior parte do lote passou na balança no mesmo dia, vira a pesagem do lote.
  let pesagens = 0;
  for(const t of tocados){ const [lid, data] = t.split('|'); const l = porId('lotes', lid); if(!l) continue;
    const ps = S.animais.filter(a=>a.loteId===lid && a.pesos && a.pesos.some(p=>p.data===data)).map(a=>a.pesos.filter(p=>p.data===data).pop().kg);
    if(ps.length >= Math.max(3, cabecasAtuais(l)*0.5)){ S.pesagens = S.pesagens.filter(p=>!(p.loteId===lid && p.data===data && p.auto)); S.pesagens.push({id:id(), loteId:lid, data, pesoMedio:Math.round(ps.reduce((s,x)=>s+x,0)/ps.length), auto:true}); pesagens++; } }
  importPrevia = null; salvar();
  toast([pesos&&`${pesos} pesos`, mov&&`${mov} ${mov>1?'mudanças':'mudança'} de curral`, novos&&`${novos} ${novos>1?'animais novos':'animal novo'}`, pesagens&&`${pesagens} pesagem(ns) de lote`].filter(Boolean).join(', ') || 'Leituras conferidas');
  render();
}
